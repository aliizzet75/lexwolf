services:
  db:
    image: ankane/pgvector:latest
    container_name: lexwolf-db
    environment:
      POSTGRES_DB: lexwolf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: lexwolf-neo4j
    environment:
      - NEO4J_AUTH=neo4j/lexwolf123
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lexwolf-api
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/lexwolf
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=lexwolf123
      - OPENAI_API_KEY=your_openai_api_key_here
      - CLAUDE_API_KEY=your_claude_api_key_here
      - ENV=development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
  neo4j_data: