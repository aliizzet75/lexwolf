version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=lexwolf
      - POSTGRES_PASSWORD=lexwolf
      - POSTGRES_DB=lexwolf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexwolf"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: