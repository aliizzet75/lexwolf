<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LexWolf Word Add-In</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; }
    textarea { width: 100%; height: 80px; }
    button { margin-top: 8px; padding: 8px 16px; }
    #status { margin-top: 12px; color: #555; }
  </style>
</head>
<body>
  <h3>LexWolf Word Add-In</h3>
  <p>Proof-of-Concept: Text an Cursor-Position einfügen.</p>
  <textarea id="inputText">Hier steht ein Vorschlag von LexWolf.</textarea>
  <button id="insertBtn">In Word einfügen</button>
  <div id="status"></div>

  <script>
    Office.onReady(function(info) {
      const status = document.getElementById('status');
      if (info.host === Office.HostType.Word) {
        status.textContent = 'Bereit (Word erkannt).';
      } else {
        status.textContent = 'Nicht in Word ausgeführt.';
      }
    });

    document.getElementById('insertBtn').addEventListener('click', function() {
      const text = document.getElementById('inputText').value;
      Office.context.document.setSelectedDataAsync(text, function(result) {
        const status = document.getElementById('status');
        if (result.status === Office.AsyncResultStatus.Succeeded) {
          status.textContent = 'Text eingefügt.';
        } else {
          status.textContent = 'Fehler: ' + result.error.message;
        }
      });
    });
  </script>
</body>
</html>
